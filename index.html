<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRE Vocab Builder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font for a clean look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for option buttons feedback */
        .option-button {
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .option-button:hover:not(.correct):not(.incorrect) {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        .option-button.correct {
            background-color: #10B981; /* Green-500 */
            color: white;
            pointer-events: none; /* Disable clicks after selection */
        }
        .option-button.incorrect {
            background-color: #EF4444; /* Red-500 */
            color: white;
            pointer-events: none; /* Disable clicks after selection */
        }
        .option-button.disabled {
            pointer-events: none; /* Disable clicks */
            opacity: 0.7;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-200 min-h-screen flex items-center justify-center p-4">

                <div id="groupPracticeOptions" style="display:none;" class="pl-7 mb-4">
                    <select id="play-group-selector" class="p-2 border border-gray-300 rounded-md w-full md:w-3/4 shadow-sm">
                        <!-- Saved groups will be populated here by JS -->
                    </select>
                </div>

                <!-- Lowest Time Mode -->

                </div>
                <div id="lowestTimeOptions" style="display:none;" class="pl-7">
                    <label for="fillInsCount" class="text-sm text-gray-600">Number of fill-ins to practice:</label>

                </div>

                <!-- Highest Score Mode -->

                    <label for="highestScoreCheckbox" class="text-gray-700 font-medium">Highest Score</label>
                </div>
                <div id="highestScoreOptions" style="display:none;" class="pl-7">
                    <label for="timeDuration" class="text-sm text-gray-600">Practice duration (in minutes):</label>

            <div class="text-center mb-6">

                         <label for="group-word-selector" class="block text-sm font-medium text-gray-700 text-left">Select Words</for>

            </div>

    </div>

        /**
         * Formats seconds into MM:SS format.
         */
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        // --- localStorage Record Management ---

        function getLowestTimes(specific = false) {
            const key = specific ? 'lowestTimes_specific' : 'lowestTimes';
            return JSON.parse(localStorage.getItem(key)) || {};
        }

        function saveLowestTime(count, time, specific = false) {
            const key = specific ? 'lowestTimes_specific' : 'lowestTimes';
            const lowestTimes = getLowestTimes(specific);
            lowestTimes[count] = time;
            localStorage.setItem(key, JSON.stringify(lowestTimes));
        }

        function getHighestScores(specific = false) {
            const key = specific ? 'highestScores_v2_specific' : 'highestScores_v2';
            return JSON.parse(localStorage.getItem(key)) || {};
        }

        function saveHighestScore(duration, score, specific = false) {
            const key = specific ? 'highestScores_v2_specific' : 'highestScores_v2';
            const highestScores = getHighestScores(specific);
            highestScores[duration] = score;
            localStorage.setItem(key, JSON.stringify(highestScores));
        }

        /**
         * Shuffles an array in place using the Fisher-Yates (Knuth) shuffle algorithm.
         * @param {Array} array The array to shuffle.
         * @returns {Array} The shuffled array.
         */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]]; // Swap elements
            }
            return array;
        }

        /**
         * Generates the quiz questions with a correct answer and three random incorrect options.
         */
        function generateQuestions() {
            questions = [];
            let sourceSentences = [...sentences];
            let sourceWordsForOptions = wordsData.map(w => w.word);
            const isGroupPractice = practiceGroupCheckbox.checked;
            const isSpecific = practiceSpecificWordsCheckbox.checked;

            if (isGroupPractice) {
                const selectedGroupName = playGroupSelector.value;
                const groups = getWordGroups();
                if (selectedGroupName && groups[selectedGroupName]) {
                    const selectedWords = groups[selectedGroupName];
                    if (selectedWords.length === 0) {
                        alert("The selected group is empty. Please edit the group to add words.");
                        return false;
                    }
                    sourceSentences = sentences.filter(s => selectedWords.includes(s.word));
                    sourceWordsForOptions = [...selectedWords];
                } else {
                    alert("Please select a valid group or uncheck 'Practice a Saved Group'.");
                    return false;
                }
            } else if (isSpecific) {
                const selectedWords = Array.from(specificWordsSelector.selectedOptions).map(opt => opt.value);
                if (selectedWords.length > 0) {
                    sourceSentences = sentences.filter(s => selectedWords.includes(s.word));
                    sourceWordsForOptions = [...selectedWords];
                } else {
                    alert("Please select at least one word for specific practice, or uncheck the 'Practice Specific Words' box.");
                    return false; // Indicate failure
                }
            }

            if (sourceSentences.length === 0) {
                 alert("No sentences available for the selected words.");
                 return false;
            }


            const shuffledSourceSentences = shuffleArray(sourceSentences);

            shuffledSourceSentences.forEach(qData => {
                const correctAnswer = qData.word;
                let options = [correctAnswer];
                let potentialDistractors = sourceWordsForOptions.filter(w => w !== correctAnswer);

                if (potentialDistractors.length < 3) {
                    const generalDistractors = wordsData.map(w => w.word).filter(w => w !== correctAnswer && !potentialDistractors.includes(w));
                    potentialDistractors.push(...shuffleArray(generalDistractors));
                }

                potentialDistractors = shuffleArray(potentialDistractors);

                for (let i = 0; options.length < 4 && i < potentialDistractors.length; i++) {
                    if (!options.includes(potentialDistractors[i])) {
                         options.push(potentialDistractors[i]);
                    }
                }

                while(options.length < 4 && wordsData.length >= 4) {
                    let emergencyOption = wordsData[Math.floor(Math.random() * wordsData.length)].word;
                    if (!options.includes(emergencyOption)) {
                        options.push(emergencyOption);
                    }
                }

                options = shuffleArray(options);

                questions.push({
                    sentence: qData.sentence,
                    correctAnswer: correctAnswer,
                    options: options
                });
            });

            if (lowestTimeCheckbox.checked) {
                const count = parseInt(fillInsCount.value, 10);
                if (questions.length > count) {
                    questions = questions.slice(0, count);
                }
            }

            totalQuestionsElement.textContent = questions.length;
            return true; // Indicate success
        }

        /**
         * Displays the current question and its options.
         */
        function displayQuestion() {
            feedbackArea.textContent = '';
            nextButton.style.display = 'none';

            if (currentQuestionIndex >= questions.length) {
                endGame(false); // Game ended by finishing questions, not by timeout
                return;
            }
            questionArea.style.display = 'block';
            currentScoreDisplay.style.display = 'flex';
            feedbackArea.style.display = 'block';

            const question = questions[currentQuestionIndex];
            questionTextElement.textContent = question.sentence;
            optionsContainer.innerHTML = '';

            question.options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add(
                    'option-button', 'bg-blue-50', 'hover:bg-blue-100', 'text-blue-800', 'font-semibold',
                    'py-3', 'px-4', 'rounded-lg', 'border', 'border-blue-200',
                    'transition', 'duration-200', 'ease-in-out', 'w-full', 'text-lg'
                );
                button.addEventListener('click', () => checkAnswer(button, option, question.correctAnswer));
                optionsContainer.appendChild(button);
            });

            document.querySelectorAll('.option-button').forEach(btn => {
                btn.classList.remove('correct', 'incorrect', 'disabled');
                btn.style.pointerEvents = 'auto';
            });
        }

        /**
         * Checks the selected answer against the correct answer.
         */
        function checkAnswer(selectedButton, selectedOption, correctAnswer) {
            document.querySelectorAll('.option-button').forEach(button => {
                button.classList.add('disabled');
                button.style.pointerEvents = 'none';
            });

            if (selectedOption === correctAnswer) {
                feedbackArea.innerHTML = '<span style="color: #10B981;">Correct!</span>';
                selectedButton.classList.add('correct');
                correctAnswers++;
                updateScoreDisplay();
                setTimeout(nextQuestion, 1000);
            } else {
                wrongAnswers++;
                selectedButton.classList.add('incorrect');
                if (!wronglyAnsweredQuestions.find(q => q.sentence === questions[currentQuestionIndex].sentence)) {
                    wronglyAnsweredQuestions.push(questions[currentQuestionIndex]);
                }
                const correctWordData = wordsData.find(w => w.word === correctAnswer);
                const selectedWordData = wordsData.find(w => w.word === selectedOption);
                let feedbackHTML = `
                    <div class="text-left text-sm">
                        <p class="mb-1"><strong style="color: #EF4444;">Your Answer: ${selectedOption}</strong></p>
                        <p style="color: #EF4444;" class="pl-2">- ${selectedWordData ? selectedWordData.meaning : 'Meaning not found.'}</p>
                        <hr class="my-2 border-gray-300">
                        <p class="mb-1"><strong style="color: #10B981;">Correct Answer: ${correctAnswer}</strong></p>
                        <p style="color: #10B981;" class="pl-2">- ${correctWordData ? correctWordData.meaning : 'Meaning not found.'}</p>
                    </div>
                `;
                feedbackArea.innerHTML = feedbackHTML;
                document.querySelectorAll('.option-button').forEach(button => {
                    if (button.textContent === correctAnswer) {
                        button.classList.add('correct');
                    }
                });
                updateScoreDisplay();
                nextButton.style.display = 'block';
            }
        }

            const remaining = questions.length - (correctAnswers + wrongAnswers);
            remainingWordsDisplay.innerHTML = `Remaining: <span class="text-purple-600 font-bold">${remaining}</span>`;

        /**
         * Ends the game and displays the final score.
         * @param {boolean} timedOut - True if the game ended due to the timer running out.
         */
        function endGame(timedOut = false) {
            clearInterval(timerInterval);
            const isSpecific = practiceSpecificWordsCheckbox.checked;
            const isGroupPractice = practiceGroupCheckbox.checked;

            questionArea.style.display = 'none';
            feedbackArea.style.display = 'none';
            nextButton.style.display = 'none';
            currentScoreDisplay.style.display = 'none';
            remainingWordsDisplay.style.display = 'none';
            timerDisplay.textContent = '';
            gameOverMessage.innerHTML = ''; // Clear previous message

            if (lowestTimeCheckbox.checked || ((isSpecific || isGroupPractice) && !highestScoreCheckbox.checked)) {
                const timeTaken = Math.round((Date.now() - startTime) / 1000);
                const count = questions.length;
                let message = `You completed ${count} fill-ins in ${formatTime(timeTaken)} with ${wrongAnswers} mistake(s).`;

                if (wrongAnswers > 0) {
                    message += `<br>You cannot save your time because you made mistakes.`;
                } else {
                    const lowestTimes = getLowestTimes(isSpecific);
                    const bestTime = lowestTimes[count];

                    if (bestTime === undefined || timeTaken < bestTime) {
                        message += ` This is a new record!`;
                        if (confirm(message + " Save this time?")) {
                            saveLowestTime(count, timeTaken, isSpecific);
                            recordDisplay.textContent = `New Best Time: ${formatTime(timeTaken)}`;
                        }
                    } else {
                        message += `<br>Your best time for this set is ${formatTime(bestTime)}.`;
                    }
                }
                gameOverMessage.innerHTML = message;
            } else if (highestScoreCheckbox.checked) {
                const durationMinutes = parseInt(timeDuration.value, 10);
                const remainingTime = timedOut ? 0 : timeLeft;
                let message;

                if (timedOut) {
                    timerDisplay.textContent = "Time's up!";
                    message = `Time's up! You scored ${correctAnswers} out of ${questions.length}.`;
                } else {
                    message = `You finished all ${questions.length} questions with ${formatTime(remainingTime)} remaining.`;
                }

                if (wrongAnswers > 0 && !timedOut) {
                     message += `<br>You made ${wrongAnswers} mistake(s), so this score won't be recorded.`;
                } else if (!timedOut) {
                    const highestScores = getHighestScores(isSpecific);
                    let recordKey = durationMinutes;
                    if (isSpecific) {
                        recordKey = durationMinutes + '_' + questions.length;
                    }
                    const bestScore = highestScores[recordKey];

                    if (bestScore === undefined || remainingTime > bestScore) {
                        message += ` This is a new high score!`;
                        if (confirm(message + " Save this score?")) {
                            highestScores[recordKey] = remainingTime;
                            const storageKey = isSpecific ? 'highestScores_v2_specific' : 'highestScores_v2';
                            localStorage.setItem(storageKey, JSON.stringify(highestScores));
                            recordDisplay.textContent = `New Best Score: ${formatTime(remainingTime)} remaining`;
                        }
                    } else {
                        message += `<br>The best score for this set is ${formatTime(bestScore)} remaining.`;
                    }
                }
                gameOverMessage.innerHTML = message;
            } else {
                // Standard mode (no timer, no specific words)
                gameOverMessage.style.display = 'block';
                document.getElementById('final-score-correct').textContent = correctAnswers;
                document.getElementById('final-score-wrong').textContent = wrongAnswers;
                document.getElementById('final-score-total').textContent = questions.length;
                gameOverMessage.innerHTML = `Game Over! Your final score is <span class="text-green-600">${correctAnswers}</span>-<span class="text-red-600">${wrongAnswers}</span> out of <span class="text-gray-600">${questions.length}</span>.`;
            }

            gameOverMessage.style.display = 'block';
            restartButton.style.display = 'block';
            if (wronglyAnsweredQuestions.length > 0) {
                retestWrongButton.style.display = 'block';
            } else {
                retestWrongButton.style.display = 'none';
            }
        }


        /**
         * Starts a retest with only the questions that were answered incorrectly.
         */
        function retestWrongQuestions() {
            if (wronglyAnsweredQuestions.length === 0) {
                restartGame();
                return;
            }
            questions = shuffleArray([...wronglyAnsweredQuestions]);
            wronglyAnsweredQuestions = [];
            currentQuestionIndex = 0;
            correctAnswers = 0;
            wrongAnswers = 0;

            questionArea.style.display = 'block';
            feedbackArea.style.display = 'block';
            gameOverMessage.style.display = 'none';
            restartButton.style.display = 'none';
            retestWrongButton.style.display = 'none';
            currentScoreDisplay.style.display = 'flex';
            remainingWordsDisplay.style.display = 'block';

            updateScoreDisplay();
            displayQuestion();
        }

        /**
         * Resets the game to its initial state.
         */
        function restartGame() {
            clearInterval(timerInterval);
            currentQuestionIndex = 0;
            correctAnswers = 0;
            wrongAnswers = 0;
            wronglyAnsweredQuestions = [];
            timeLeft = 0;

            gameOverMessage.style.display = 'none';
            restartButton.style.display = 'none';
            retestWrongButton.style.display = 'none';
            timerDisplay.textContent = '';
            recordDisplay.textContent = '';

            settingsArea.style.display = 'block';
            startGameButton.style.display = 'block';
            manageGroupsButton.style.display = 'inline-block';
            questionArea.style.display = 'none';
            feedbackArea.style.display = 'none';
            currentScoreDisplay.style.display = 'none';
            remainingWordsDisplay.style.display = 'none';
            nextButton.style.display = 'none';
        }

        function startGame() {
            if (generateQuestions()) {
                updateScoreDisplay();
                displayQuestion();

                settingsArea.style.display = 'none';
                startGameButton.style.display = 'none';
                manageGroupsButton.style.display = 'none';
                questionArea.style.display = 'block';
                feedbackArea.style.display = 'block';
                currentScoreDisplay.style.display = 'flex';
                remainingWordsDisplay.style.display = 'block';

                const isSpecific = practiceSpecificWordsCheckbox.checked;
                const isGroupPractice = practiceGroupCheckbox.checked;
                startTime = Date.now();

                if (lowestTimeCheckbox.checked || ((isSpecific || isGroupPractice) && !highestScoreCheckbox.checked)) {
                    timerInterval = setInterval(() => {
                        const seconds = Math.floor((Date.now() - startTime) / 1000);
                        timerDisplay.textContent = `Time: ${formatTime(seconds)}`;
                    }, 1000);

                    const count = questions.length;
                    const lowestTimes = getLowestTimes(isSpecific);
                    const recordText = `Best Time for these ${count} words:`;
                    if (lowestTimes[count]) {
                        recordDisplay.textContent = `${recordText} ${formatTime(lowestTimes[count])}`;
                    } else {
                        recordDisplay.textContent = `No record for this set yet.`;
                    }
                } else if (highestScoreCheckbox.checked) {
                    const durationMinutes = parseInt(timeDuration.value, 10);
                    timeLeft = durationMinutes * 60;
                    timerDisplay.textContent = `Time Left: ${formatTime(timeLeft)}`;

                    timerInterval = setInterval(() => {
                        timeLeft--;
                        timerDisplay.textContent = `Time Left: ${formatTime(timeLeft)}`;
                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            endGame(true); // Timed out
                        }
                    }, 1000);

                    const highestScores = getHighestScores(isSpecific);
                    let recordKey = durationMinutes;
                    let recordText = `Best Score for ${durationMinutes} min:`;
                    if (isSpecific) {
                        recordKey = durationMinutes + '_' + questions.length;
                        recordText = `Best Score for these ${questions.length} specific words:`;
                    }

                    if (highestScores[recordKey]) {
                        recordDisplay.textContent = `${recordText} ${formatTime(highestScores[recordKey])} remaining`;
                    } else {
                        recordDisplay.textContent = `No record for this set yet.`;
                    }
                } else {
                    // Standard mode (no timer, no specific words)
                    timerDisplay.textContent = '';
                    recordDisplay.textContent = '';
                }
            }
        }

        // --- Group Management Logic ---

        function openGroupModal() {
            groupManagementModal.style.display = 'block';
            loadGroupsIntoSelector();
            populateGroupWordSelector();
            resetModal();
        }

        function closeGroupModal() {
            groupManagementModal.style.display = 'none';
        }

        function populateGroupWordSelector() {
            if (groupWordSelector.options.length > 0) return; // Populate only once
            groupWordSelector.innerHTML = '';
            wordsData.forEach(wordObj => {
                const option = document.createElement('option');
                option.value = wordObj.word;
                option.textContent = wordObj.word;
                groupWordSelector.appendChild(option);
            });
        }

        function getWordGroups() {
            return JSON.parse(localStorage.getItem('wordGroups')) || {};
        }

        function saveWordGroup(name, words) {
            if (!name) {
                alert('Please enter a group name.');
                return;
            }
            if (words.length === 0) {
                alert('Please select at least one word for the group.');
                return;
            }
            const groups = getWordGroups();
            groups[name] = words;
            localStorage.setItem('wordGroups', JSON.stringify(groups));
            alert(`Group '${name}' saved successfully!`);
            loadGroupsIntoSelector(); // Refresh the list
            loadPlayableGroups(); // Also refresh the list in the main settings
        }

        function deleteWordGroup(name) {
            const groups = getWordGroups();
            if (groups[name]) {
                if (confirm(`Are you sure you want to delete the group '${name}'?`)) {
                    delete groups[name];
                    localStorage.setItem('wordGroups', JSON.stringify(groups));
                    alert(`Group '${name}' deleted.`);
                    loadGroupsIntoSelector(); // Refresh the list
                    loadPlayableGroups(); // Also refresh the list in the main settings
                    resetModal();
                }
            }
        }

        function loadGroupsIntoSelector() {
            const groups = getWordGroups();
            const currentGroup = groupSelector.value;
            groupSelector.innerHTML = '<option value="new-group">-- Create New Group --</option>';
            for (const name in groups) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                groupSelector.appendChild(option);
            }
            // Try to preserve selection, otherwise default to new
            groupSelector.value = currentGroup && groups[currentGroup] ? currentGroup : 'new-group';
        }

        function handleGroupSelectionChange() {
            const selectedGroupName = groupSelector.value;
            const groups = getWordGroups();
            if (selectedGroupName === 'new-group') {
                resetModal();
            } else {
                groupNameInput.value = selectedGroupName;
                // Clear current selections
                Array.from(groupWordSelector.options).forEach(opt => opt.selected = false);
                // Select words from the loaded group
                const groupWords = groups[selectedGroupName] || [];
                groupWords.forEach(word => {
                    const option = Array.from(groupWordSelector.options).find(opt => opt.value === word);
                    if (option) {
                        option.selected = true;
                    }
                });
                deleteGroupButton.style.display = 'inline-block';
            }
        }

        function resetModal() {
            groupNameInput.value = '';
            groupSelector.value = 'new-group';
            Array.from(groupWordSelector.options).forEach(opt => opt.selected = false);
            groupWordSearch.value = '';
            filterWordsInGroupSelector(); // Clear filter
            deleteGroupButton.style.display = 'none';
        }

        function filterWordsInGroupSelector() {
            const filter = groupWordSearch.value.toUpperCase();
            const options = groupWordSelector.getElementsByTagName('option');
            for (let i = 0; i < options.length; i++) {
                const txtValue = options[i].textContent || options[i].innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    options[i].style.display = "";
                } else {
                    options[i].style.display = "none";
                }
            }
        }

        // Event listeners
        nextButton.addEventListener('click', nextQuestion);
        restartButton.addEventListener('click', restartGame);
        retestWrongButton.addEventListener('click', retestWrongQuestions);
        startGameButton.addEventListener('click', startGame);

        function loadPlayableGroups() {
            const groups = getWordGroups();
            playGroupSelector.innerHTML = '';
            if (Object.keys(groups).length === 0) {
                playGroupSelector.innerHTML = '<option value="">No groups saved</option>';
                return;
            }
            for (const name in groups) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                playGroupSelector.appendChild(option);
            }
        }

        practiceGroupCheckbox.addEventListener('change', function() {
            groupPracticeOptions.style.display = this.checked ? 'block' : 'none';
            if (this.checked) {
                practiceSpecificWordsCheckbox.checked = false;
                specificWordsOptions.style.display = 'none';
                loadPlayableGroups();
            }
        });

        practiceSpecificWordsCheckbox.addEventListener('change', function() {
            specificWordsOptions.style.display = this.checked ? 'block' : 'none';
            if (this.checked) {
                practiceGroupCheckbox.checked = false;
                groupPracticeOptions.style.display = 'none';
            }
        });

        specificWordsSelector.addEventListener('change', () => {
            const selectedCount = specificWordsSelector.selectedOptions.length;
            if (selectedCount > 0) {
                fillInsCount.value = selectedCount * 2;
            }
        });

        wordSearchInput.addEventListener('keyup', () => {
            const filter = wordSearchInput.value.toUpperCase();
            const options = specificWordsSelector.getElementsByTagName('option');
            for (let i = 0; i < options.length; i++) {
                const txtValue = options[i].textContent || options[i].innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    options[i].style.display = "";
                } else {
                    options[i].style.display = "none";
                }
            }
        });

        lowestTimeCheckbox.addEventListener('change', function() {
            if (this.checked) {
                lowestTimeOptions.style.display = 'block';
                highestScoreCheckbox.checked = false;
                highestScoreOptions.style.display = 'none';
            } else {
                lowestTimeOptions.style.display = 'none';
            }
        });

        highestScoreCheckbox.addEventListener('change', function() {
            if (this.checked) {
                highestScoreOptions.style.display = 'block';
                lowestTimeCheckbox.checked = false;
                lowestTimeOptions.style.display = 'none';
            } else {
                highestScoreOptions.style.display = 'none';
            }
        });

        window.onload = function() {
            populateWordSelector();

            // Group Management Event Listeners
            manageGroupsButton.addEventListener('click', openGroupModal);
            closeModalButton.addEventListener('click', closeGroupModal);
            saveGroupButton.addEventListener('click', () => {
                const groupName = groupNameInput.value.trim();
                const selectedWords = Array.from(groupWordSelector.selectedOptions).map(opt => opt.value);
                saveWordGroup(groupName, selectedWords);
            });
            deleteGroupButton.addEventListener('click', () => {
                const groupName = groupSelector.value;
                if (groupName !== 'new-group') {
                    deleteWordGroup(groupName);
                }
            });
            groupSelector.addEventListener('change', handleGroupSelectionChange);
            groupWordSearch.addEventListener('keyup', filterWordsInGroupSelector);

            settingsArea.style.display = 'block';
            startGameButton.style.display = 'block';
            questionArea.style.display = 'none';
            feedbackArea.style.display = 'none';
            currentScoreDisplay.style.display = 'none';
            remainingWordsDisplay.style.display = 'none';
            nextButton.style.display = 'none';
            restartButton.style.display = 'none';
            retestWrongButton.style.display = 'none';
            gameOverMessage.style.display = 'none';
        };
    </script>
</body>
</html>
