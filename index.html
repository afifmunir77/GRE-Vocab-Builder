        }

        .option-button {
            transition: background-color 0.3s ease, transform 0.2s ease;

        }
        .option-button:hover:not(.correct):not(.incorrect) {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        .option-button.correct {
            background-color: #10B981; /* Green-500 */
            color: white;
            pointer-events: none; /* Disable clicks after selection */
        }
        .option-button.incorrect {
            background-color: #EF4444; /* Red-500 */
            color: white;
            pointer-events: none; /* Disable clicks after selection */
        }
        .option-button.disabled {
            pointer-events: none; /* Disable clicks */
            opacity: 0.7;
        }

        /**

         */
        function populateWordSelector() {
            wordsData.forEach(wordObj => {
                const option = document.createElement('option');
                option.value = wordObj.word;
                option.textContent = wordObj.word;
                specificWordsSelector.appendChild(option);
            });

        /**
         * Shuffles an array in place using the Fisher-Yates (Knuth) shuffle algorithm.
         * @param {Array} array The array to shuffle.
         * @returns {Array} The shuffled array.
         */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]]; // Swap elements
            }
            return array;
        }

        /**
         * Generates the quiz questions with a correct answer and three random incorrect options.
         */
        function generateQuestions() {
            questions = [];
            let sourceSentences = [...sentences];
            let sourceWordsForOptions = wordsData.map(w => w.word);

            if (practiceSpecificWordsCheckbox.checked) {
                const selectedWords = Array.from(specificWordsSelector.selectedOptions).map(opt => opt.value);
                if (selectedWords.length > 0) {
                    sourceSentences = sentences.filter(s => selectedWords.includes(s.word));
                    // Use selected words for options primarily
                    sourceWordsForOptions = [...selectedWords];
                } else {
                    // If checkbox is checked but no words selected, maybe revert to all or show a message?
                    // For now, it will result in 0 questions if no words are selected.
                    // Or, we can default to all wordsData if selectedWords is empty.
                    // Let's default to no questions if specific is checked but none selected.
                    sourceSentences = [];
                }
            }

            if (sourceSentences.length === 0 && practiceSpecificWordsCheckbox.checked) {
                 // If specific practice is chosen but no words are selected or no sentences match,
                 // display a message or handle appropriately. For now, no questions will be generated.
                 // We could alert the user here.
                 alert("Please select at least one word for specific practice, or uncheck the 'Practice Specific Words' box.");
                 totalQuestionsElement.textContent = 0;
                 // Potentially hide question area and show a message
                 questionArea.style.display = 'none';
                 feedbackArea.textContent = 'No words selected for practice.';
                 nextButton.style.display = 'none';
                 currentScoreDisplay.style.display = 'none';
                 // Ensure start button and settings are visible if we bail here
                 startGameButton.style.display = 'block';
                 settingsArea.style.display = 'block';
                 return false; // Indicate failure to generate questions
            } else if (sourceSentences.length === 0) {
                // This case should ideally not happen if not specific practice, means sentences array is empty
                alert("No sentences available to generate questions.");
                totalQuestionsElement.textContent = 0;
                // Ensure start button and settings are visible if we bail here
                startGameButton.style.display = 'block';
                settingsArea.style.display = 'block';
                return false; // Indicate failure to generate questions
            }


            const shuffledSourceSentences = shuffleArray(sourceSentences);

            shuffledSourceSentences.forEach(qData => {
                const correctAnswer = qData.word;
                let options = [correctAnswer];

                // Get potential incorrect options
                let potentialDistractors = sourceWordsForOptions.filter(w => w !== correctAnswer);

                // If sourceWordsForOptions (selected words) are not enough, add from general pool
                if (potentialDistractors.length < 3) {
                    const generalDistractors = wordsData.map(w => w.word).filter(w => w !== correctAnswer && !potentialDistractors.includes(w));
                    potentialDistractors.push(...shuffleArray(generalDistractors));
                }

                potentialDistractors = shuffleArray(potentialDistractors);

                for (let i = 0; options.length < 4 && i < potentialDistractors.length; i++) {
                    if (!options.includes(potentialDistractors[i])) { // Ensure no duplicate options
                         options.push(potentialDistractors[i]);
                    }
                }

                // If after all that, we still don't have 4 options (e.g. very few total words)
                // This is an edge case, might need more robust handling if total word pool is tiny
                while(options.length < 4 && wordsData.length >= 4) {
                    let emergencyOption = wordsData[Math.floor(Math.random() * wordsData.length)].word;
                    if (!options.includes(emergencyOption)) {
                        options.push(emergencyOption);
                    }
                }


                options = shuffleArray(options);

                questions.push({
                    sentence: qData.sentence,
                    correctAnswer: correctAnswer,
                    options: options
                });
            });
            totalQuestionsElement.textContent = questions.length;
            // Ensure game area is visible if it was hidden due to no selection
            // This logic will be moved to startGame function
            // if(questions.length > 0) {
            //     questionArea.style.display = 'block';
            //     currentScoreDisplay.style.display = 'flex';
            // }
            return true; // Indicate success
        }

            document.querySelectorAll('.option-button').forEach(button => {

                button.style.pointerEvents = 'none'; // Ensure no more clicks

                correctAnswers++;
            } else {
                feedbackArea.textContent = 'Incorrect. The correct answer was: ' + correctAnswer;
                feedbackArea.style.color = '#EF4444'; // Tailwind red-500
                selectedButton.classList.add('incorrect');
                wrongAnswers++;
                // Add to list of wrong questions if not already (for retest mode)
                if (!wronglyAnsweredQuestions.find(q => q.sentence === questions[currentQuestionIndex].sentence)) {
                    wronglyAnsweredQuestions.push(questions[currentQuestionIndex]);
                }

                // Highlight the correct answer
                document.querySelectorAll('.option-button').forEach(button => {
                    if (button.textContent === correctAnswer) {
                        button.classList.add('correct');
                    }
                });
            }
            updateScoreDisplay();
            nextButton.style.display = 'block'; // Show next button
        }

        /**
         * Updates the score display on the page.
         */
        function updateScoreDisplay() {
            currentScoreDisplay.innerHTML = `Score: <span class="text-green-600">${correctAnswers}</span>-<span class="text-red-600">${wrongAnswers}</span> out of <span id="total-questions" class="text-gray-600">${questions.length}</span>`;
        }

        /**
         * Advances to the next question or ends the game.
         */
        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
        }

        /**
         * Ends the game and displays the final score.
         */
        function endGame() {
            questionArea.style.display = 'none';
            feedbackArea.style.display = 'none';
            nextButton.style.display = 'none';
            currentScoreDisplay.style.display = 'none';

            gameOverMessage.style.display = 'block';
            finalScoreCorrectElement.textContent = correctAnswers;
            finalScoreWrongElement.textContent = wrongAnswers;
            finalScoreTotalElement.textContent = questions.length; // This should be original total or retest total
            restartButton.style.display = 'block';

            if (wronglyAnsweredQuestions.length > 0) {
                retestWrongButton.style.display = 'block';
            } else {
                retestWrongButton.style.display = 'none';
            }
        }


        /**
         * Starts a retest with only the questions that were answered incorrectly.
         */
        function retestWrongQuestions() {
            if (wronglyAnsweredQuestions.length === 0) {
                // Fallback, though button shouldn't be visible
                restartGame();
                return;
            }
            questions = [...wronglyAnsweredQuestions]; // Use a copy
            wronglyAnsweredQuestions = []; // Clear for the next round of potential wrong answers in retest
            currentQuestionIndex = 0;
            correctAnswers = 0;
            wrongAnswers = 0;

            questionArea.style.display = 'block';
            feedbackArea.style.display = 'block';
            gameOverMessage.style.display = 'none';
            restartButton.style.display = 'none';
            retestWrongButton.style.display = 'none';
            currentScoreDisplay.style.display = 'flex';

            // totalQuestionsElement.textContent = questions.length; // Update total for retest - Handled by updateScoreDisplay
            updateScoreDisplay();
            displayQuestion();
        }

        /**
         * Resets the game to its initial state.
         */
        function restartGame() {
            currentQuestionIndex = 0;
            correctAnswers = 0;
            wrongAnswers = 0;
            wronglyAnsweredQuestions = [];

            gameOverMessage.style.display = 'none';
            restartButton.style.display = 'none';
            retestWrongButton.style.display = 'none';

            // Show settings and start button, hide game elements
            settingsArea.style.display = 'block';
            startGameButton.style.display = 'block';
            questionArea.style.display = 'none';
            feedbackArea.style.display = 'none';
            currentScoreDisplay.style.display = 'none';
            nextButton.style.display = 'none';
             // No automatic question generation here, wait for user to click "Start Game"
        }

        function startGame() {
            if (generateQuestions()) { // generateQuestions now returns true on success, false on failure (e.g. no words selected)
                updateScoreDisplay();
                displayQuestion();

                // Hide settings and start button, show game elements
                settingsArea.style.display = 'none';
                startGameButton.style.display = 'none';
                questionArea.style.display = 'block';
                feedbackArea.style.display = 'block'; // Will be cleared by displayQuestion
                currentScoreDisplay.style.display = 'flex'; // Or 'block'
                // Next button is shown after an answer
            }
            // If generateQuestions returned false, an alert was already shown, and UI remains in pre-game state.
        }

        // Event listeners
        nextButton.addEventListener('click', nextQuestion);
        restartButton.addEventListener('click', restartGame);
        retestWrongButton.addEventListener('click', retestWrongQuestions);
        startGameButton.addEventListener('click', startGame);
        practiceSpecificWordsCheckbox.addEventListener('change', function() {
            if (this.checked) {
                specificWordsSelector.style.display = 'block';
            } else {
                specificWordsSelector.style.display = 'none';
            }
        });

        // Initialize settings when the window loads
        window.onload = function() {
            populateWordSelector();
            // Initial UI State: Show settings and start button, hide game elements
            settingsArea.style.display = 'block';
            startGameButton.style.display = 'block';
            questionArea.style.display = 'none';
            feedbackArea.style.display = 'none';
            currentScoreDisplay.style.display = 'none';
            nextButton.style.display = 'none';
            restartButton.style.display = 'none';
            retestWrongButton.style.display = 'none';
            gameOverMessage.style.display = 'none';
        };
    </script>
</body>
</html>
